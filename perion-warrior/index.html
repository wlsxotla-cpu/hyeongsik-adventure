<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="페리온 전사">
<meta name="theme-color" content="#1a1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>페리온 전사</title>
<style>
:root{--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--sb:env(safe-area-inset-bottom);--gold:#f0b94a;--gold2:#ffe08a;--ink:#2b1c14;--panel:#2a2034;--panel2:#1c1524;--line:#e8b04a;--hp:#ff4d5e;--mp:#3e8bff;--exp:#ffd24a;--ok:#5fd68a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d0a12;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff}
#app{position:fixed;left:0;top:0;overflow:hidden;background:#000;transform-origin:0 0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
/* ───── HUD ───── */
#hud{position:absolute;inset:0;pointer-events:none}
#stat{position:absolute;left:calc(8px + var(--sl));top:8px;width:210px;padding:6px 8px 7px;background:linear-gradient(#2a2034cc,#1c1524cc);border:2px solid #e8b04a99;border-radius:12px;box-shadow:0 3px 10px #0008}
#stat .row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#lvb{background:linear-gradient(#ffd96a,#e8932a);color:#3a1d08;font-weight:900;font-size:12px;padding:1px 7px;border-radius:9px;border:1.5px solid #5a2d0a;white-space:nowrap}
#nm{font-size:13px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mesob{margin-left:auto;font-size:11px;color:#ffe08a;white-space:nowrap}
.bar{position:relative;height:15px;border-radius:8px;background:#0008;border:1.5px solid #000a;overflow:hidden;margin-bottom:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .18s}
.bar b{position:absolute;left:0;right:0;top:0;text-align:center;font-size:10.5px;line-height:14px;text-shadow:0 1px 2px #000,0 0 3px #000;font-weight:800}
#hpbar i{background:linear-gradient(#ff8a96,#e8283e)}
#mpbar i{background:linear-gradient(#7cb8ff,#2a62e0)}
#xpbar{height:10px;margin:0}
#xpbar i{background:linear-gradient(#fff29a,#e8a82a)}
#xpbar b{font-size:8.5px;line-height:9px}
#obj{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:34%;min-width:150px;text-align:center;background:#1c1524cc;border:2px solid #e8b04a88;border-radius:12px;padding:5px 12px;font-size:12.5px;font-weight:700;line-height:1.3;box-shadow:0 3px 8px #0007}
#obj small{display:block;font-weight:500;color:#ffd98a;font-size:10.5px}
#obj.ready{border-color:#5fd68a;box-shadow:0 0 12px #5fd68a88}
#topbtns{position:absolute;right:calc(8px + var(--sr));top:8px;display:flex;gap:6px;pointer-events:auto}
.tb{width:44px;height:44px;border-radius:12px;border:2px solid #e8b04aaa;background:linear-gradient(#3a2d48dd,#221a2cdd);font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.tb:active{transform:scale(.94)}
.tb .dot{position:absolute;right:-3px;top:-3px;background:#ff4d5e;border-radius:9px;min-width:16px;height:16px;font-size:10px;font-weight:900;line-height:16px;text-align:center;border:1.5px solid #fff;display:none}
#mini{position:absolute;right:calc(8px + var(--sr));top:58px;width:130px;height:30px;border-radius:8px;background:#0007;border:1.5px solid #e8b04a77}
#minin{position:absolute;right:calc(8px + var(--sr));top:90px;font-size:10px;color:#ffe9b0;text-shadow:0 1px 2px #000;text-align:right;max-width:150px;line-height:1.2}
#log{position:absolute;left:calc(8px + var(--sl));top:84px;width:230px;font-size:11.5px;line-height:1.35;text-shadow:0 1px 2px #000,0 0 3px #000}
#log div{animation:fadeout 6s forwards;padding:1px 0}
#log .g{color:#ffe36a}#log .e{color:#b9ff8a}#log .i{color:#bfe2ff}#log .q{color:#ffb86a}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
#bossbar{position:absolute;left:50%;top:68px;transform:translateX(-50%);width:44%;display:none}
#bossbar .nm{text-align:center;font-weight:900;font-size:13px;text-shadow:0 2px 3px #000;margin-bottom:2px;color:#ffd0c0}
#bossbar .bar{height:16px;border-color:#000;border-width:2px}
#bossbar i{background:linear-gradient(#ff9a7a,#d6281e)}
#hint{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:#fff;color:#2b1c14;font-weight:800;font-size:14px;padding:7px 14px;border-radius:16px;border:3px solid #e8932a;box-shadow:0 4px 12px #0009;display:none;animation:bob 1.1s ease-in-out infinite;text-align:center;max-width:46%}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0}
#banner h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#ffe36a;-webkit-text-stroke:2px #5a2d0a;text-shadow:0 4px 0 #5a2d0a,0 0 22px #ffb83a}
#banner p{margin:4px 0 0;font-size:14px;font-weight:700;text-shadow:0 2px 3px #000}
#banner.show{animation:banner 2.8s ease forwards}
@keyframes banner{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#mapname{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none}
#mapname.show{animation:mapn 3s ease forwards}
#mapname h2{margin:0;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000,0 0 14px #000;letter-spacing:2px}
#mapname p{margin:2px 0 0;font-size:13px;color:#ffd98a;text-shadow:0 2px 4px #000}
@keyframes mapn{0%{opacity:0;letter-spacing:10px}15%{opacity:1;letter-spacing:2px}75%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
/* ───── 조작 ───── */
#ctl{position:absolute;inset:0;pointer-events:none}
#pad{position:absolute;left:calc(26px + var(--sl) + var(--px,0px));bottom:calc(22px + var(--sb) + var(--py,0px));width:204px;height:132px;pointer-events:auto;touch-action:none}
#pad .k{position:absolute;width:64px;height:64px;border-radius:18px;background:linear-gradient(#ffffff30,#ffffff10);border:2.5px solid #ffffffaa;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 3px #000;backdrop-filter:blur(2px)}
#pad .k.on{background:linear-gradient(#ffd96a,#e8932a);color:#3a1d08;transform:scale(.94)}
#pad [data-k=up]{left:70px;top:0}#pad [data-k=left]{left:0;top:66px}#pad [data-k=down]{left:70px;top:66px}#pad [data-k=right]{left:140px;top:66px}
.rb{position:absolute;border-radius:50%;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;text-shadow:0 2px 3px #000;overflow:hidden;padding:0}
.rb .ic{font-size:inherit;position:relative;z-index:1}
.rb.on{transform:scale(.92);filter:brightness(1.25)}
#bAtk{right:calc(16px + var(--sr) + var(--bx,0px));bottom:calc(14px + var(--sb) + var(--by,0px));width:88px;height:88px;font-size:38px;background:radial-gradient(circle at 35% 30%,#ff9a5a,#d6341e);border-color:#ffe0c0;box-shadow:0 4px 12px #0008,inset 0 -6px 10px #7a1408aa}
#bJump{right:calc(116px + var(--sr) + var(--bx,0px));bottom:calc(14px + var(--sb) + var(--by,0px));width:68px;height:68px;font-size:28px;background:radial-gradient(circle at 35% 30%,#7ad0ff,#2a7ae0);border-color:#d6efff;box-shadow:0 4px 10px #0008,inset 0 -5px 8px #0a3a7aaa}
#skills{position:absolute;right:calc(14px + var(--sr) + var(--bx,0px));bottom:calc(110px + var(--sb) + var(--by,0px));width:190px;display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:6px;pointer-events:none;justify-content:flex-start}
#skills .rb{position:relative;width:54px;height:54px;font-size:25px;background:radial-gradient(circle at 35% 30%,#8a78c8,#3a2a78);border-color:#e0d6ff;box-shadow:0 3px 8px #0008}
#skills .rb.buff{background:radial-gradient(circle at 35% 30%,#6ad0a0,#1a7a52)}
#skills .rb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:#000b;z-index:2}
#skills .rb .mp{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;z-index:3;color:#9fd0ff;text-shadow:0 1px 2px #000}
#skills .rb.nomp{filter:grayscale(.8) brightness(.7)}
#skills .rb .act{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px #ffe36a;z-index:3;display:none}
#pots{position:absolute;right:calc(108px + var(--sr));top:8px;display:flex;flex-direction:row;gap:6px;pointer-events:none}
#pots .rb{position:relative;width:50px;height:50px;font-size:19px;flex-direction:column;gap:0;line-height:1;background:radial-gradient(circle at 35% 30%,#4a3a5c,#221a2c);border-color:#e8b04acc}
#pots .rb b{position:static;margin-top:1px;font-size:15px;font-weight:900;color:#ffe36a;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 3px #000;z-index:3}
#pots .rb.empty b{color:#ff6a6a}#pots .rb.empty{filter:grayscale(.6) brightness(.8)}
#pots .rb.hp{border-color:#ff7a8a}#pots .rb.mp{border-color:#7ab4ff}
#bCtx{position:absolute;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);min-width:130px;height:52px;border-radius:26px;padding:0 20px;font-size:16px;font-weight:900;color:#3a1d08;background:linear-gradient(#fff2a8,#f0a52a);border:3px solid #5a2d0a;box-shadow:0 4px 12px #0009;pointer-events:auto;display:none;animation:pulse 1s ease-in-out infinite;text-shadow:0 1px 0 #fff8}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
/* ───── 패널 ───── */
#modal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:auto;touch-action:pan-y}
#modal.on{display:flex}
.panel{background:linear-gradient(#352a44,#201829);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 14px #000b;position:relative;max-height:94%;display:flex;flex-direction:column}
.panel h3{margin:0;padding:8px 14px;font-size:15px;background:linear-gradient(#f0b94a,#c07a1a);color:#3a1d08;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between}
.x{background:#00000033;border:2px solid #3a1d08;border-radius:8px;width:30px;height:30px;font-size:15px;color:#3a1d08;font-weight:900;padding:0}
.btn{border:2.5px solid #5a2d0a;background:linear-gradient(#ffe48a,#f0a52a);color:#3a1d08;font-weight:900;border-radius:11px;padding:0 14px;min-height:44px;font-size:14px;font-family:inherit}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.sm{min-height:34px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.green{background:linear-gradient(#a8f0b8,#3aa85a);border-color:#0a4a20}
.btn.red{background:linear-gradient(#ffb0a8,#d6483a);border-color:#5a0a08}
.btn.gray{background:linear-gradient(#d0d0dc,#8a8a9e);border-color:#2a2a3a;color:#222}
.btn[disabled]{filter:grayscale(1) brightness(.7);pointer-events:none}
#menu{width:min(94%,720px);height:min(94%,350px)}
#menu .body{display:flex;flex:1;min-height:0}
#tabs{width:84px;display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:#150f1c;border-radius:0 0 0 14px;overflow:auto}
#tabs button{border:2px solid #4a3a5c;background:#2a2034;color:#d8c8f0;border-radius:10px;font-size:12px;font-weight:800;padding:8px 2px;min-height:44px;position:relative;font-family:inherit}
#tabs button.on{background:linear-gradient(#ffe48a,#f0a52a);color:#3a1d08;border-color:#5a2d0a}
#tabs .badge{position:absolute;right:2px;top:2px;background:#ff4d5e;color:#fff;border-radius:8px;font-size:9px;min-width:15px;height:15px;line-height:15px}
#tcont{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
.slot{aspect-ratio:1;border-radius:11px;background:linear-gradient(#4a3c5c,#2a2036);border:2px solid #6a5a80;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;min-height:54px;padding:0;color:#fff}
.slot.eq{border-color:#ffd24a;box-shadow:inset 0 0 8px #ffd24a66}
.slot.sel{border-color:#5fd68a;box-shadow:0 0 10px #5fd68a}
.slot .ii{width:84%;height:84%;pointer-events:none;object-fit:contain}
.ii.mini{width:26px;height:26px;vertical-align:middle}
.slot .en{position:absolute;right:3px;top:1px;font-size:10px;font-weight:900;color:#7aff9a;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot small{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot .lv{position:absolute;left:3px;top:1px;font-size:9px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000}
.slot .lv.bad{color:#ff7a8a}
.slot.off{filter:grayscale(.85) brightness(.7)}
.slot .offt{position:absolute;left:0;right:0;bottom:13px;text-align:center;font-size:10px;color:#ff6a6a;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000;line-height:1}
.slot .up{position:absolute;left:3px;top:1px;color:#7aff9a;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000;line-height:1}
.slot.empty{opacity:.45;font-size:11px;color:#b8a8d0}
.eqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:8px}
.eqrow .slot{aspect-ratio:auto;height:46px;min-height:46px;font-size:22px}
.eqrow .c{text-align:center;font-size:10px;color:#cdbbe8}
.card{background:#150f1c;border:2px solid #4a3a5c;border-radius:12px;padding:9px 11px;margin-bottom:8px;font-size:12.5px;line-height:1.45}
.card b{color:#ffe08a}
.card .nm{font-size:14px;font-weight:900}
.row2{display:flex;gap:8px;align-items:center}
.sk{display:flex;gap:10px;align-items:center;background:#150f1c;border:2px solid #4a3a5c;border-radius:12px;padding:8px 10px;margin-bottom:7px}
.sk .ic{width:46px;height:46px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#8a78c8,#3a2a78);border:2px solid #e0d6ff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.sk.lock{opacity:.5}
.sk .t{flex:1;font-size:12px;line-height:1.35}.sk .t b{font-size:13.5px}
.st{display:flex;align-items:center;gap:8px;background:#150f1c;border:2px solid #4a3a5c;border-radius:10px;padding:5px 10px;margin-bottom:6px;font-size:13px}
.st span{flex:1}.st b{color:#ffe08a;min-width:36px;text-align:right}
.tog{display:flex;align-items:center;justify-content:space-between;background:#150f1c;border:2px solid #4a3a5c;border-radius:12px;padding:8px 12px;margin-bottom:7px;font-size:13px;min-height:44px}
.sw{width:50px;height:28px;border-radius:14px;background:#555;position:relative;border:2px solid #000;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#3aa85a}.sw.on::after{left:24px}
.qrow{border-left:5px solid #ffb83a}.qrow.ready{border-left-color:#5fd68a}.qrow.done{border-left-color:#777;opacity:.6}
.pbar{height:8px;border-radius:4px;background:#0008;overflow:hidden;margin-top:3px}.pbar i{display:block;height:100%;background:linear-gradient(#a8f0b8,#3aa85a)}
/* NPC 대화 */
#dlg{width:min(96%,700px);max-height:96%}
#dlg .body{display:flex;gap:12px;padding:12px;min-height:0;overflow:auto}
#dlg canvas{width:84px;height:100px;flex:none;background:radial-gradient(circle,#5a4a6e,#2a2036);border-radius:12px;border:2px solid #6a5a80}
#dlg .txt{flex:1;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
#dlg .txt b{color:#ffe08a}
#dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#shop{width:min(96%,760px);height:min(96%,350px)}
#shop .body{display:flex;flex-direction:column;flex:1;min-height:0}
#shop .tabs2{display:flex;gap:6px;padding:8px 10px 0}
#shop .list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;min-height:0}
.it{display:flex;align-items:center;gap:9px;background:#150f1c;border:2px solid #4a3a5c;border-radius:12px;padding:6px 9px;margin-bottom:6px}
.it .slot{width:46px;height:46px;min-height:46px;flex:none;font-size:22px}
.it .t{flex:1;font-size:12px;line-height:1.35}.it .t b{font-size:13px}
.price{color:#ffe08a;font-weight:900;font-size:12.5px;white-space:nowrap}
#death{width:min(80%,380px);text-align:center;padding:18px}
#death h2{margin:0 0 6px;font-size:22px;color:#ff8a8a}
/* 주문서 연출 */
#enhp{width:min(94%,540px)}
#enhp .stage{position:relative;height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 55%,#5a4678,#1c1524 75%);overflow:hidden;border-bottom:2px solid #00000066}
#enhp .gear{width:112px;height:112px;position:relative;z-index:2;filter:drop-shadow(0 4px 6px #000a)}
#enhp .glow{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:radial-gradient(circle,#ffe36acc,#ffb83a44 45%,transparent 70%);opacity:0;z-index:1}
#enhp .scr{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:3;opacity:0;animation:scrIn .8s ease-in forwards}
@keyframes scrIn{0%{opacity:0;transform:translate(-150px,-80px) rotate(-40deg) scale(1.5)}25%{opacity:1}75%{opacity:1;transform:translate(10px,10px) rotate(12deg) scale(1)}100%{opacity:0;transform:translate(0,6px) rotate(0) scale(.45)}}
#enhp .stage.busy .gear{animation:enhShake .11s linear infinite .8s}
#enhp .stage.busy .glow{animation:enhPulse .55s ease-in-out infinite .8s}
@keyframes enhShake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-2deg)}50%{transform:translate(2px,-2px) rotate(2deg)}75%{transform:translate(-2px,-1px) rotate(-1deg)}100%{transform:translate(0,0)}}
@keyframes enhPulse{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.25)}}
#enhp .stage.ok .gear{animation:enhPop .6s ease-out}
#enhp .stage.ok .glow{opacity:1;animation:enhGlow 1.2s ease-out forwards}
@keyframes enhPop{0%{transform:scale(.9)}40%{transform:scale(1.3)}100%{transform:scale(1.05)}}
@keyframes enhGlow{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:.35}}
#enhp .stage.fail .gear{animation:enhShake .08s 6;filter:grayscale(1) brightness(.55) drop-shadow(0 4px 6px #000a)}
#enhp .stage.fail{background:radial-gradient(circle at 50% 55%,#3a3038,#120e16 75%)}
#enhp .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#enhp .flash.on{animation:enhFlash .7s ease-out}
@keyframes enhFlash{0%{opacity:.95}100%{opacity:0}}
#enhp .sp{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;z-index:4;animation:spk 1s ease-out forwards}
@keyframes spk{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#enhp .res{min-height:92px;padding:10px 14px;text-align:center;font-size:13px;line-height:1.5}
#enhp .res .big{font-size:25px;font-weight:900;letter-spacing:1px;margin-bottom:2px}
#enhp .res .big.ok{color:#fff27a;-webkit-text-stroke:1.5px #8a4a08;text-shadow:0 3px 0 #8a4a08,0 0 16px #ffc93a}
#enhp .res .big.bad{color:#b8b8c8;text-shadow:0 2px 0 #000}
#enhp .res .dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#enhp .btns{display:flex;gap:8px;justify-content:center;padding:0 12px 12px}
/* 타이틀 */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#0006,#000d);pointer-events:auto}
#title .logo{font-size:52px;font-weight:900;color:#ffe36a;-webkit-text-stroke:3px #5a2d0a;text-shadow:0 6px 0 #5a2d0a,0 0 30px #ff9a2a;letter-spacing:4px;line-height:1}
#title .sub{margin:6px 0 14px;font-size:13px;font-weight:800;color:#ffd9a0;text-shadow:0 2px 4px #000;letter-spacing:3px}
#title input{width:220px;height:44px;border-radius:12px;border:3px solid #e8b04a;background:#1c1524;color:#fff;font-size:17px;text-align:center;font-family:inherit;margin-bottom:10px;user-select:text;-webkit-user-select:text}
#title .btns{display:flex;gap:10px}
#title .btn{min-width:150px;min-height:52px;font-size:17px}
#title .ver{position:absolute;bottom:8px;font-size:10px;color:#fff8;text-align:center;width:100%}
/* 레벨업 */
#lvup{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
#lvup.show{animation:lvup 2.6s ease forwards}
#lvup h1{margin:0;font-size:52px;font-weight:900;color:#fff7a8;-webkit-text-stroke:3px #b8600a;text-shadow:0 5px 0 #7a3a08,0 0 30px #ffd24a}
#lvup p{margin:2px 0 0;font-size:15px;font-weight:800;text-shadow:0 2px 4px #000;color:#fff}
@keyframes lvup{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}24%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
@media (max-height:340px){#stat{width:180px;transform:scale(.9);transform-origin:0 0}}
</style>
